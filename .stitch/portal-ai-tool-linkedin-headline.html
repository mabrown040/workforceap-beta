<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>LinkedIn Headline — WorkforceAP</title><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/><link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/><style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}*{box-sizing:border-box;}body{font-family:Inter,sans-serif;background:#fcf9f8;color:#1c1b1b;margin:0;}</style></head><body>
<div style="max-width:700px;margin:0 auto;padding:0 0 4rem;">
  <div style="padding:1.25rem 2rem 1.5rem;border-bottom:1px solid #ebe7e7;background:#f6f3f2;">
    <nav style="display:flex;align-items:center;gap:0.35rem;font-size:0.8rem;color:#584144;margin-bottom:1rem;"><a href="/dashboard/ai-tools" style="color:#8c0f37;text-decoration:none;font-weight:500;">Career Suite</a><span class="material-symbols-outlined" style="font-size:0.9rem;">chevron_right</span><span style="font-weight:600;">LinkedIn Headline</span></nav>
    <div style="display:flex;align-items:center;gap:0.75rem;">
      <div style="width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#0077b5,#005885);display:flex;align-items:center;justify-content:center;"><span class="material-symbols-outlined" style="font-size:1.35rem;color:#fff;">title</span></div>
      <div><h1 style="font-size:1.375rem;font-weight:800;letter-spacing:-0.02em;margin:0 0 0.125rem;">LinkedIn Headline Generator</h1><p style="font-size:0.8rem;color:#584144;margin:0;">Stand out in search results with a headline that gets clicks.</p></div>
    </div>
  </div>
  <div style="padding:2rem;display:flex;flex-direction:column;gap:1.5rem;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Target Job Title</label><input type="text" placeholder="Cybersecurity Analyst" value="Cybersecurity Analyst" style="width:100%;padding:0.75rem 1rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div>
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Top 3 Skills</label><input type="text" placeholder="Network Security, SIEM, CompTIA" value="Network Security, SIEM, CompTIA A+" style="width:100%;padding:0.75rem 1rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div>
    </div>
    <button style="padding:0.875rem;background:linear-gradient(135deg,#0077b5,#005885);color:#fff;font-weight:700;font-size:0.9rem;border:none;border-radius:0.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;"><span class="material-symbols-outlined" style="font-size:1.1rem;">auto_fix_high</span>Generate Headlines</button>

    <!-- Results -->
    <div>
      <p style="font-size:0.8rem;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;color:#584144;margin-bottom:0.875rem;">Choose Your Headline</p>
      <div style="display:flex;flex-direction:column;gap:0.75rem;">
        <label style="display:flex;align-items:flex-start;gap:0.875rem;background:#fff;border:2px solid #8c0f37;border-radius:0.75rem;padding:1.125rem;cursor:pointer;">
          <input type="radio" name="headline" checked style="margin-top:0.2rem;accent-color:#8c0f37;"/>
          <div><p style="font-weight:700;font-size:0.9rem;color:#1c1b1b;margin-bottom:0.25rem;">Cybersecurity Professional | Google Certified | Network Defense & SIEM</p><p style="font-size:0.75rem;color:#584144;">Keyword-rich · 72 chars · Best for recruiter search</p></div>
        </label>
        <label style="display:flex;align-items:flex-start;gap:0.875rem;background:#fff;border:1px solid #ebe7e7;border-radius:0.75rem;padding:1.125rem;cursor:pointer;">
          <input type="radio" name="headline" style="margin-top:0.2rem;accent-color:#8c0f37;"/>
          <div><p style="font-weight:700;font-size:0.9rem;color:#1c1b1b;margin-bottom:0.25rem;">Aspiring Cybersecurity Analyst | CompTIA A+ | Passionate About Protecting Systems</p><p style="font-size:0.75rem;color:#584144;">Authentic · 81 chars · Good for entry-level</p></div>
        </label>
        <label style="display:flex;align-items:flex-start;gap:0.875rem;background:#fff;border:1px solid #ebe7e7;border-radius:0.75rem;padding:1.125rem;cursor:pointer;">
          <input type="radio" name="headline" style="margin-top:0.2rem;accent-color:#8c0f37;"/>
          <div><p style="font-weight:700;font-size:0.9rem;color:#1c1b1b;margin-bottom:0.25rem;">🔒 IT & Security Professional | Open to Cybersecurity Roles | Austin, TX</p><p style="font-size:0.75rem;color:#584144;">Casual · 69 chars · High engagement style</p></div>
        </label>
      </div>
      <button style="width:100%;margin-top:1.25rem;padding:0.875rem;background:#8c0f37;color:#fff;font-weight:700;font-size:0.9rem;border:none;border-radius:0.5rem;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:0.5rem;"><span class="material-symbols-outlined" style="font-size:1.1rem;">content_copy</span>Copy Selected Headline</button>
    </div>
  </div>
</div></body></html>
