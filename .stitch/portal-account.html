<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Account — WorkforceAP</title>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}body{font-family:Inter,sans-serif;background:#fcf9f8;color:#1c1b1b;}</style>
</head><body>
<div style="max-width:700px;margin:0 auto;padding:2rem 2rem 4rem;">
  <!-- Profile hero -->
  <div style="background:#fff;border-radius:1rem;padding:2rem;border:1px solid #ebe7e7;margin-bottom:2rem;display:flex;align-items:center;gap:1.5rem;">
    <div style="width:72px;height:72px;border-radius:9999px;background:linear-gradient(135deg,#8c0f37,#ad2c4d);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <span style="color:#fff;font-weight:900;font-size:1.5rem;">JD</span>
    </div>
    <div style="flex:1;">
      <h1 style="font-size:1.5rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.25rem;">James Davis</h1>
      <p style="color:#584144;font-size:0.875rem;margin-bottom:0.75rem;">james.davis@email.com</p>
      <div style="display:flex;gap:0.5rem;flex-wrap:wrap;">
        <span style="padding:0.25rem 0.75rem;border-radius:9999px;background:#fff1f2;color:#8c0f37;font-size:0.75rem;font-weight:700;">Member</span>
        <span style="padding:0.25rem 0.75rem;border-radius:9999px;background:#f0edec;color:#584144;font-size:0.75rem;font-weight:600;">Since Jan 2026</span>
        <span style="padding:0.25rem 0.75rem;border-radius:9999px;background:#dcfce7;color:#166534;font-size:0.75rem;font-weight:600;">Cybersecurity Track</span>
      </div>
    </div>
  </div>

  <!-- Quick links -->
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-bottom:2rem;">
    <a href="/dashboard/profile" style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-decoration:none;display:flex;align-items:center;gap:0.875rem;">
      <span class="material-symbols-outlined" style="font-size:1.25rem;color:#8c0f37;">person</span>
      <div><p style="font-weight:600;font-size:0.875rem;color:#1c1b1b;margin:0;">My Profile</p><p style="font-size:0.75rem;color:#584144;margin:0;">Edit bio & details</p></div>
    </a>
    <a href="/dashboard/settings" style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-decoration:none;display:flex;align-items:center;gap:0.875rem;">
      <span class="material-symbols-outlined" style="font-size:1.25rem;color:#7b5800;">settings</span>
      <div><p style="font-weight:600;font-size:0.875rem;color:#1c1b1b;margin:0;">Settings</p><p style="font-size:0.75rem;color:#584144;margin:0;">Notifications & privacy</p></div>
    </a>
    <a href="/dashboard/certifications" style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-decoration:none;display:flex;align-items:center;gap:0.875rem;">
      <span class="material-symbols-outlined" style="font-size:1.25rem;color:#474646;">workspace_premium</span>
      <div><p style="font-weight:600;font-size:0.875rem;color:#1c1b1b;margin:0;">Certifications</p><p style="font-size:0.75rem;color:#584144;margin:0;">3 earned · 1 in progress</p></div>
    </a>
    <a href="/help" style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-decoration:none;display:flex;align-items:center;gap:0.875rem;">
      <span class="material-symbols-outlined" style="font-size:1.25rem;color:#584144;">help</span>
      <div><p style="font-weight:600;font-size:0.875rem;color:#1c1b1b;margin:0;">Help Center</p><p style="font-size:0.75rem;color:#584144;margin:0;">FAQs & support</p></div>
    </a>
  </div>

  <!-- Sign out -->
  <div style="text-align:center;">
    <button style="padding:0.75rem 2rem;background:#f0edec;color:#584144;border:none;border-radius:0.5rem;font-size:0.875rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:0.5rem;">
      <span class="material-symbols-outlined" style="font-size:1rem;">logout</span>Sign Out
    </button>
  </div>
</div>
</body></html>
