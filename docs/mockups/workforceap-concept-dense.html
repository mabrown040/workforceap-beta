<title>WorkforceAP • Concept: Dense Command</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.h-font{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-weight:800;letter-spacing:-.02em}
.tabnum{font-variant-numeric:tabular-nums}
.bento{transition:box-shadow .15s,border-color .15s,background-color .12s}
.focus-ring:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px #ad2c4d}
@keyframes fade{from{opacity:0}to{opacity:1}}
.fade{animation:fade .2s ease forwards}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bento{transition:none}}
::-webkit-scrollbar{width:7px;height:7px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:3px}
/* DENSE: sharp corners, tight, hairline borders, compact */
.card{background:#fff;border:1px solid #e4e4e4;border-radius:10px;padding:14px}
.kbar{background:#fff;border:1px solid #e4e4e4;border-radius:8px;padding:10px 12px}
</style>
</head>
<body class="bg-[#eef0f2] text-[#1A1A1A]">

<script>
const C={crimson:'#ad2c4d',crimsonDk:'#8b1f38',gold:'#a47f38',info:'#2b7bb9',green:'#4a9b4f',muted:'#737373'};
function kpis(arr){return `<div class="grid grid-cols-3 lg:grid-cols-6 gap-2.5 mb-3">${arr.map(k=>`<div class="kbar bento"><div class="text-[9px] font-bold text-[#737373] uppercase tracking-wide">${k.l}</div><div class="tabnum text-2xl font-extrabold leading-none mt-1" style="color:${k.c||'#1a1a1a'}">${k.v}</div>${k.sub?`<div class="text-[9px] font-bold mt-0.5" style="color:${k.sc||C.muted}">${k.sub}</div>`:''}</div>`).join('')}</div>`;}
function tag(t,k){const m={ok:['#4a9b4f','#eef7ef'],warn:['#a47f38','#FEF3C7'],alert:['#ad2c4d','#fdf2f4'],info:['#2b7bb9','#eef5fb'],muted:['#737373','#f5f5f5']};const[c,bg]=m[k]||m.muted;return `<span class="tabnum" style="color:${c};background:${bg};padding:2px 7px;border-radius:5px;font-size:8px;font-weight:700;text-transform:uppercase">${t}</span>`;}
function table(cols,rows,title,action){return `<div class="card !p-0 overflow-hidden bento">${title?`<div class="flex items-center justify-between px-3 py-2 border-b border-[#e4e4e4]"><span class="font-bold text-xs">${title}</span>${action||''}</div>`:''}<div class="overflow-x-auto"><table class="w-full border-collapse min-w-[560px]"><thead><tr>${cols.map(c=>`<th style="font-size:8px;text-transform:uppercase;letter-spacing:.05em;color:#a3a3a3;font-weight:700;text-align:left;padding:7px 10px;background:#fafafa">${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="hover:bg-[#fafafa] cursor-pointer">${r.map(c=>`<td style="padding:7px 10px;font-size:11px;border-bottom:1px solid #f2f2f2">${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function bars(title,arr){return `<div class="card bento"><div class="font-bold text-xs mb-3">${title}</div><div class="space-y-2 text-[11px]">${arr.map(b=>`<div><div class="flex justify-between mb-0.5"><span class="font-semibold">${b.l}</span><span class="tabnum text-[#737373]">${b.v}</span></div><div class="h-1.5 bg-[#f0f0f0] rounded-full overflow-hidden"><div class="h-1.5 rounded-full" style="width:${b.p}%;background:${b.c||C.crimson}"></div></div></div>`).join('')}</div></div>`;}
function miniqueue(title,rows){return `<div class="card !p-0 bento overflow-hidden"><div class="px-3 py-2 border-b border-[#e4e4e4] font-bold text-xs">${title}</div><div class="divide-y divide-[#f2f2f2]">${rows.map(r=>`<div class="flex items-center gap-2 px-3 py-2 hover:bg-[#fafafa] cursor-pointer"><span class="w-1.5 h-1.5 rounded-full shrink-0" style="background:${r.c}"></span><div class="flex-1 min-w-0"><div class="font-bold text-[11px] truncate">${r.t}</div><div class="text-[10px] text-[#737373] truncate">${r.m}</div></div><button class="text-[10px] font-bold px-2 py-0.5 rounded" style="color:${r.c};background:${r.bg}">${r.a}</button></div>`).join('')}</div></div>`;}

'partner-home':()=>kpis([{l:'Referred',v:'142',c:C.info},{l:'In Training',v:'88'},{l:'Certified',v:'37',c:C.gold},{l:'Placed',v:'38',c:C.green},{l:'Placement %',v:'27%',c:C.green},{l:'Need Attn',v:'5',c:C.crimson}])+

   ${['red','yellow','blue'].map(t=>{const cfg={red:[C.crimson,'Urgent — today',[['Carlos Torres','No activity 16d'],['Tanya Reed','Reply overdue 52h'],['Devon Hill','No activity 11d']]],yellow:[C.gold,'Watch — this week',[['Sam Cole','Assessment incomplete'],['Nia Foster','SLA warning 30h'],['Jordan Pike','Stale training']]],blue:[C.info,'Celebrate',[['Aisha Williams','Cert earned'],['Marcus Lee','Course done']]]}[t];return `<div class="card !p-0 bento overflow-hidden"><div class="px-3 py-2 text-[10px] font-bold uppercase tracking-widest text-white" style="background:${cfg[0]}">${cfg[1]} · ${cfg[2].length}</div><div class="divide-y divide-[#f2f2f2]">${cfg[2].map(r=>`<div class="px-3 py-2 hover:bg-[#fafafa] cursor-pointer"><div class="font-bold text-[11px]">${r[0]}</div><div class="text-[10px] text-[#737373]">${r[1]}</div></div>`).join('')}</div></div>`;}).join('')}</div>`,

let cur={p:'member',s:'home'};
const prail=document.getElementById('prail'),stabs=document.getElementById('stabs'),stage=document.getElementById('stage');
PERSONAS.forEach(p=>{const b=document.createElement('button');b.className='nav-p w-full flex items-center gap-2.5 px-2.5 py-1.5 rounded font-semibold text-left text-[#cfcfcf] hover:bg-[#242424] focus-ring';b.dataset.p=p.id;b.innerHTML=`<i class="fa-solid ${p.ic} w-4 text-center text-[12px] text-[#888]"></i>${p.t}`;b.onclick=()=>{cur={p:p.id,s:p.screens[0][0]};render();};prail.appendChild(b);});
function render(){
  const P=PERSONAS.find(x=>x.id===cur.p);
  document.getElementById('ptitle').textContent=P.t;
  document.getElementById('pgoal').innerHTML=`<i class="fa-solid fa-bullseye text-[#ad2c4d] mr-1"></i><b>Goal:</b> ${P.goal}`;
  stabs.innerHTML=P.screens.map(s=>`<button data-s="${s[0]}" class="px-3 py-1.5 text-[13px] font-semibold rounded-t border-b-2 ${s[0]===cur.s?'border-[#ad2c4d] text-[#ad2c4d]':'border-transparent text-[#737373] hover:text-[#1a1a1a]'}">${s[1]}</button>`).join('');
  stabs.querySelectorAll('button').forEach(b=>b.onclick=()=>{cur.s=b.dataset.s;render();});
  const fn=S[cur.p+'-'+cur.s];
  stage.innerHTML=`<div class="fade">${fn?fn():'<div class="card">Screen pending.</div>'}</div>`;
  prail.querySelectorAll('.nav-p').forEach(b=>{const on=b.dataset.p===cur.p;b.classList.toggle('bg-[#ad2c4d]',on);b.classList.toggle('text-white',on);b.classList.toggle('text-[#cfcfcf]',!on);});
  window.scrollTo({top:0,behavior:'smooth'});
}
render();
</script>
</body>
</html>
