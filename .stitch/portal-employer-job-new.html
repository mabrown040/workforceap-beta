<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}*{box-sizing:border-box;}body{font-family:Inter,sans-serif;background:#fcf9f8;color:#1c1b1b;margin:0;}</style><title>New Job Posting — WorkforceAP</title></head><body>
<div style="max-width:700px;margin:0 auto;padding:2rem 2rem 4rem;">
  <header style="margin-bottom:2rem;"><a href="/employer/jobs" style="display:inline-flex;align-items:center;gap:0.375rem;font-size:0.875rem;font-weight:500;color:#8c0f37;text-decoration:none;margin-bottom:1rem;"><span class="material-symbols-outlined" style="font-size:1rem;">arrow_back</span>Back to Jobs</a>
  <h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">Post a Job</h1>
  <div style="height:6px;background:#f0edec;border-radius:9999px;overflow:hidden;margin-bottom:0.25rem;"><div style="height:100%;width:33%;background:linear-gradient(90deg,#8c0f37,#ad2c4d);border-radius:9999px;"></div></div>
  <p style="font-size:0.75rem;color:#584144;">Step 1 of 3 — Job Details</p></header>
  <div style="background:#fff;border-radius:0.75rem;padding:2rem;border:1px solid #ebe7e7;display:flex;flex-direction:column;gap:1.25rem;">
    <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Job Title *</label><input type="text" placeholder="e.g. IT Support Specialist" style="width:100%;padding:0.75rem 1rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Job Type *</label><select style="width:100%;padding:0.75rem 1rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;color:#1c1b1b;outline:none;font-family:Inter,sans-serif;"><option>Full-time</option><option>Part-time</option><option>Contract</option></select></div>
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Location *</label><input type="text" placeholder="Austin, TX or Remote" style="width:100%;padding:0.75rem 1rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div>
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Min Salary</label><div style="position:relative;"><span style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:#584144;font-weight:600;">$</span><input type="text" placeholder="50,000" style="width:100%;padding:0.75rem 1rem 0.75rem 2rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div></div>
      <div><label style="display:block;font-size:0.8rem;font-weight:700;color:#584144;letter-spacing:0.04em;text-transform:uppercase;margin-bottom:0.5rem;">Max Salary</label><div style="position:relative;"><span style="position:absolute;left:0.875rem;top:50%;transform:translateY(-50%);color:#584144;font-weight:600;">$</span><input type="text" placeholder="70,000" style="width:100%;padding:0.75rem 1rem 0.75rem 2rem;border:1px solid #debfc2;border-radius:0.5rem;font-size:0.875rem;background:#fff;outline:none;font-family:Inter,sans-serif;"/></div></div>
    </div>
    <div style="display:flex;justify-content:space-between;margin-top:0.5rem;">
      <button style="padding:0.625rem 1.25rem;background:#f0edec;border:none;border-radius:0.5rem;font-size:0.875rem;font-weight:600;cursor:pointer;">Save Draft</button>
      <button style="padding:0.625rem 1.5rem;background:#8c0f37;color:#fff;border:none;border-radius:0.5rem;font-size:0.875rem;font-weight:600;cursor:pointer;">Continue →</button>
    </div>
  </div>
</div></body></html>
