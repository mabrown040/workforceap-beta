<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WorkforceAP • Admin (Full Build)</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap');
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased}
.h-font{font-family:'Plus Jakarta Sans','Inter',sans-serif;font-weight:800;letter-spacing:-.03em}
.tabnum{font-variant-numeric:tabular-nums}
.bento{transition:box-shadow .2s,border-color .2s,background-color .15s}
.focus-ring:focus-visible{outline:none;box-shadow:0 0 0 2px #fff,0 0 0 4px #ad2c4d}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.fade{animation:fade .25s ease forwards}
@media (prefers-reduced-motion:reduce){.fade{animation:none}.bento{transition:none}}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:#3a3a3a;border-radius:4px}
.nav-a{transition:background-color .12s,color .12s}
.kpi{background:#fff;border:1px solid #e8e8e8;border-radius:16px;padding:16px}
.panel-card{background:#fff;border:1px solid #e8e8e8;border-radius:20px;padding:24px}
th{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:#a3a3a3;font-weight:700;text-align:left;padding:10px;background:#fafafa}
td{padding:10px;font-size:12px;border-bottom:1px solid #f5f5f5}
.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:999px;font-size:9px;font-weight:700;text-transform:uppercase}
</style>
</head>
<body class="bg-[#F7F8FA] text-[#1A1A1A]">

<div class="flex min-h-screen">
  <!-- mobile drawer overlay -->
  <div id="overlay" class="hidden fixed inset-0 bg-black/50 z-40 lg:hidden" onclick="toggleNav(false)"></div>
  <!-- ===== FULL ADMIN SIDEBAR ===== -->
  <aside id="sidebar" class="w-64 bg-[#161616] text-white fixed h-screen z-50 flex flex-col -translate-x-full lg:translate-x-0 transition-transform duration-200">
    <div class="px-5 py-4 flex items-center gap-2.5 border-b border-[#2a2a2a] shrink-0">
      <div class="w-8 h-8 bg-[#ad2c4d] rounded-lg flex items-center justify-center"><i class="fa-solid fa-shield-halved text-sm"></i></div>
      <div><div class="font-extrabold text-sm leading-none">WorkforceAP</div><div class="text-[10px] text-[#a3a3a3] mt-0.5">Admin · Austin</div></div>
    </div>
    <div class="px-3.5 py-2.5 border-b border-[#2a2a2a] shrink-0">
      <div class="relative"><i class="fa-solid fa-magnifying-glass absolute left-3 top-1/2 -translate-y-1/2 text-[#666] text-xs"></i><input placeholder="Search admin…" class="w-full bg-[#222] border border-[#333] rounded-lg pl-8 pr-2 py-1.5 text-xs text-white outline-none focus-ring" aria-label="Search admin"></div>
    </div>
    <nav id="nav" class="flex-1 overflow-y-auto px-2.5 py-3 text-[13px]"></nav>
    <div class="px-4 py-3 border-t border-[#2a2a2a] shrink-0 flex items-center gap-2.5">
      <div class="w-8 h-8 rounded-full bg-gradient-to-br from-[#a47f38] to-[#7d5f26] flex items-center justify-center font-bold text-xs">DB</div>
      <div class="min-w-0"><div class="text-xs font-bold truncate">Dad (Owner)</div><div class="text-[10px] text-[#a3a3a3]">Super Admin</div></div>
      <a href="/" class="ml-auto text-[#a3a3a3] hover:text-white text-xs focus-ring rounded" title="Design Lab"><i class="fa-solid fa-arrow-up-right-from-square"></i></a>
    </div>
  </aside>

  <!-- ===== MAIN ===== -->
  <div class="flex-1 lg:ml-64 flex flex-col min-w-0">
    <header class="sticky top-0 z-30 bg-white/90 backdrop-blur border-b border-[#e8e8e8] px-4 md:px-7 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <button onclick="toggleNav(true)" class="lg:hidden w-9 h-9 rounded-lg border border-[#e8e8e8] flex items-center justify-center focus-ring shrink-0" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
        <h1 id="ptitle" class="h-font text-lg truncate">Command Center</h1>
        <span id="pcrumb" class="hidden sm:inline text-xs text-[#737373]">/admin</span>
      </div>
      <div class="flex items-center gap-2.5">
        <span class="text-xs text-[#737373] tabnum">Tue, Jun 21 · 9:42 AM</span>
        <button class="px-3 py-2 bg-[#ad2c4d] hover:bg-[#8b1f38] text-white text-xs font-semibold rounded-full transition-colors focus-ring"><i class="fa-solid fa-plus mr-1"></i>Add Student</button>
        <button class="w-9 h-9 rounded-full border border-[#e8e8e8] flex items-center justify-center hover:bg-[#fafafa] focus-ring" aria-label="Notifications"><i class="fa-regular fa-bell text-[#525252]"></i></button>
      </div>
    </header>
    <main id="stage" class="flex-1 p-4 md:p-7"></main>
  </div>
</div>

<script>
/* ============================================================
   ADMIN NAV — mirrors lib/nav/portalNav.ts exactly
   ============================================================ */
const GROUPS=[
  {label:'Run the org',items:[
    {id:'today',t:'Command Center',ic:'fa-bolt',href:'/admin'},
    {id:'overview',t:'Detailed overview',ic:'fa-chart-column',href:'/admin/overview'},
  ]},
  {label:'Students',items:[
    {id:'members',t:'Students',ic:'fa-users',href:'/admin/members',badge:'847'},
    {id:'messages',t:'Messages',ic:'fa-comment',href:'/admin/messages',badge:'6'},
  ]},
  {label:'Programs',items:[
    {id:'programs',t:'Programs',ic:'fa-book-open',href:'/admin/programs'},
    {id:'program-requests',t:'Program requests',ic:'fa-code-branch',href:'/admin/program-change-requests',badge:'3'},
    {id:'training-progress',t:'Training progress',ic:'fa-table',href:'/admin/training-progress'},
    {id:'assessments',t:'Assessments',ic:'fa-clipboard-check',href:'/admin/assessments'},
    {id:'certifications',t:'Certificates',ic:'fa-award',href:'/admin/certifications',badge:'12'},
    {id:'career-mappings',t:'Career paths',ic:'fa-bullseye',href:'/admin/career-mappings'},
    {id:'wioa',t:'Funding eligibility',ic:'fa-clipboard-list',href:'/admin/wioa-screening'},
  ]},
  {label:'Partners & Employers',items:[
    {id:'partners',t:'Partners',ic:'fa-handshake',href:'/admin/partners'},
    {id:'employers',t:'Employers',ic:'fa-building',href:'/admin/employers'},
    {id:'screening-packs',t:'Employer screening',ic:'fa-list-check',href:'/admin/employer-screening-packs'},
    {id:'jobs',t:'Jobs',ic:'fa-briefcase',href:'/admin/jobs'},
    {id:'mentors',t:'Mentors',ic:'fa-graduation-cap',href:'/admin/mentors'},
    {id:'counselors',t:'Counselors',ic:'fa-user-tie',href:'/admin/counselors'},
    {id:'subgroups',t:'Subgroups',ic:'fa-user-group',href:'/admin/subgroups'},
  ]},
  {label:'Outcomes',items:[
    {id:'board',t:'Board outcomes',ic:'fa-arrow-trend-up',href:'/admin/board'},
    {id:'outcomes',t:'Placement outcomes',ic:'fa-chart-line',href:'/admin/outcomes'},
    {id:'placements',t:'Placements',ic:'fa-briefcase',href:'/admin/placements'},
    {id:'placement-surveys',t:'Placement surveys',ic:'fa-clipboard-check',href:'/admin/placement-surveys'},
    {id:'analytics',t:'Analytics',ic:'fa-chart-column',href:'/admin/analytics'},
  ]},
  {label:'Content',items:[
    {id:'blog',t:'Blog',ic:'fa-file-lines',href:'/admin/blog'},
    {id:'invites',t:'Invites',ic:'fa-envelope',href:'/admin/invites'},
  ]},
  {label:'Advanced',items:[
    {id:'sessions',t:'In-office sessions',ic:'fa-wand-magic-sparkles',href:'/admin/sessions'},
    {id:'pipeline',t:'Applications funnel',ic:'fa-filter',href:'/admin/pipeline'},
    {id:'duplicates',t:'Duplicate students',ic:'fa-triangle-exclamation',href:'/admin/members/duplicates'},
    {id:'users',t:'Users',ic:'fa-user',href:'/admin/users'},
    {id:'exports',t:'Exports',ic:'fa-download',href:'/admin/exports'},
    {id:'coursera',t:'Coursera',ic:'fa-rotate',href:'/admin/coursera'},
    {id:'metrics',t:'Metrics',ic:'fa-chart-line',href:'/admin/metrics'},
    {id:'weekly-recap',t:'Weekly recap',ic:'fa-chart-column',href:'/admin/weekly-recap'},
    {id:'ai-tools',t:'AI tools',ic:'fa-wand-magic-sparkles',href:'/admin/ai-tools'},
    {id:'ai-efficacy',t:'AI Efficacy',ic:'fa-bullseye',href:'/admin/analytics/ai-efficacy'},
    {id:'diagnostics',t:'Diagnostics',ic:'fa-wave-square',href:'/admin/diagnostics'},
    {id:'crons',t:'Cron Monitor',ic:'fa-stopwatch',href:'/admin/crons'},
    {id:'health',t:'System Health',ic:'fa-heart-pulse',href:'/admin/health'},
    {id:'audit',t:'Audit logs',ic:'fa-shield-halved',href:'/admin/audit-logs'},
  ]},
];

/* ---------- render sidebar ---------- */
const nav=document.getElementById('nav');
const idMeta={};
GROUPS.forEach(g=>{
  const sec=document.createElement('div');sec.className='mb-3';
  sec.innerHTML=`<div class="px-2.5 text-[10px] font-bold tracking-widest text-[#666] uppercase mb-1 mt-1">${g.label}</div>`;
  g.items.forEach(it=>{
    idMeta[it.id]={t:it.t,href:it.href};
    const b=document.createElement('button');
    b.className='nav-a w-full flex items-center justify-between px-2.5 py-1.5 rounded-lg font-semibold text-left text-[#cfcfcf] hover:bg-[#242424] focus-ring mb-0.5';
    b.dataset.id=it.id;
    b.innerHTML=`<span class="flex items-center gap-3 truncate"><i class="fa-solid ${it.ic} w-4 text-center text-[12px] text-[#888]"></i>${it.t}</span>${it.badge?`<span class="px-1.5 py-0.5 text-[9px] font-bold rounded-full bg-[#ad2c4d] text-white">${it.badge}</span>`:''}`;
    b.addEventListener('click',()=>{activate(it.id);toggleNav(false);});
    sec.appendChild(b);
  });
  nav.appendChild(sec);
});

/* ============================================================
   SHARED RENDER HELPERS
   ============================================================ */
const C={crimson:'#ad2c4d',gold:'#a47f38',info:'#2b7bb9',green:'#4a9b4f',muted:'#737373'};
function kpiRow(arr){return `<div class="grid grid-cols-2 lg:grid-cols-4 gap-3 mb-5">${arr.map(k=>`<div class="kpi bento"><div class="text-[10px] font-bold text-[#737373] uppercase tracking-wider">${k.l}</div><div class="tabnum text-3xl font-extrabold mt-1" style="color:${k.c||'#1a1a1a'}">${k.v}</div>${k.sub?`<div class="text-[10px] font-bold mt-0.5" style="color:${k.sc||C.muted}">${k.sub}</div>`:''}</div>`).join('')}</div>`;}
function header(t,sub,action){return `<div class="flex items-end justify-between flex-wrap gap-3 mb-5"><div><h2 class="h-font text-2xl">${t}</h2>${sub?`<p class="text-sm text-[#737373] mt-1">${sub}</p>`:''}</div>${action||''}</div>`;}
function btn(label,kind){const s=kind==='primary'?'bg-[#ad2c4d] hover:bg-[#8b1f38] text-white':'border border-[#e8e8e8] hover:bg-[#fafafa] text-[#1a1a1a]';return `<button class="px-4 py-2 ${s} text-xs font-semibold rounded-full transition-colors focus-ring">${label}</button>`;}
function statusTag(s){const m={ok:['#4a9b4f','#eef7ef'],warn:['#a47f38','#FEF3C7'],alert:['#ad2c4d','#fdf2f4'],info:['#2b7bb9','#eef5fb'],muted:['#737373','#f5f5f5']};const[c,bg]=m[s.k]||m.muted;return `<span class="tag" style="color:${c};background:${bg}">${s.t}</span>`;}
function table(cols,rows){return `<div class="panel-card !p-0 overflow-hidden bento"><div class="overflow-x-auto"><table class="w-full border-collapse min-w-[640px]"><thead><tr>${cols.map(c=>`<th>${c}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="hover:bg-[#fafafa] cursor-pointer">${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;}
function cards(arr){return `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">${arr.map(c=>`<div class="panel-card bento hover:shadow-md cursor-pointer"><div class="flex justify-between items-start"><div class="w-11 h-11 rounded-xl flex items-center justify-center text-lg" style="background:${c.bg||'#fdf2f4'};color:${c.ic||C.crimson}"><i class="fa-solid ${c.icon}"></i></div>${c.tag?statusTag(c.tag):''}</div><h4 class="font-bold text-base mt-3">${c.t}</h4><p class="text-[11px] text-[#737373]">${c.d}</p>${c.foot?`<div class="flex justify-between text-xs mt-3 pt-3 border-t border-[#e8e8e8]">${c.foot}</div>`:''}</div>`).join('')}</div>`;}
function bars(title,sub,arr){return `<div class="panel-card bento"><h3 class="font-extrabold text-base tracking-tight">${title}</h3>${sub?`<p class="text-[11px] text-[#737373] mb-4">${sub}</p>`:''}<div class="space-y-3 text-xs">${arr.map(b=>`<div><div class="flex justify-between mb-1"><span class="font-bold">${b.l}</span><span class="tabnum text-[#737373]">${b.v}</span></div><div class="h-2 bg-[#f5f5f5] rounded-full overflow-hidden"><div class="h-2 rounded-full" style="width:${b.p}%;background:${b.c||C.crimson}"></div></div></div>`).join('')}</div></div>`;}
function form(title,fields){return `<div class="panel-card bento max-w-2xl"><h3 class="font-extrabold text-lg tracking-tight mb-4">${title}</h3><div class="grid grid-cols-1 sm:grid-cols-2 gap-4">${fields.map(f=>`<div${f.full?' class="sm:col-span-2"':''}><label class="text-[10px] font-bold uppercase tracking-wider text-[#737373]">${f.l}</label>${f.type==='select'?`<select class="mt-1 w-full text-sm border border-[#e8e8e8] rounded-xl px-3 py-2.5 outline-none focus-ring bg-white">${f.opts.map(o=>`<option>${o}</option>`).join('')}</select>`:f.type==='toggle'?`<div class="mt-2"><span class="relative inline-block w-10 h-6"><input type="checkbox" ${f.on?'checked':''} class="peer sr-only"><span class="absolute inset-0 rounded-full bg-[#e8e8e8] peer-checked:bg-[#ad2c4d] transition-colors"></span><span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full peer-checked:translate-x-4 transition-transform"></span></span></div>`:`<input value="${f.v||''}" class="mt-1 w-full text-sm border border-[#e8e8e8] rounded-xl px-3 py-2.5 outline-none focus-ring">`}</div>`).join('')}</div><div class="mt-5">${btn('Save Changes','primary')}</div></div>`;}
function note(t){return `<div class="panel-card bento"><p class="text-sm text-[#525252] leading-relaxed">${t}</p></div>`;}

/* ============================================================
   PAGE REGISTRY — every admin route renders a real screen
   ============================================================ */
const PAGES={
  /* ---------- RUN THE ORG ---------- */
  today:()=>kpiRow([
      {l:'Active Students',v:'847',c:'#1a1a1a',sub:'↑ 32 this month',sc:C.green},
      {l:'Placements YTD',v:'213',c:C.green,sub:'↑ 18 this month',sc:C.green},
      {l:'Completion',v:'71%',c:C.info,sub:'cohort avg'},
      {l:'At Risk',v:'19',c:C.crimson,sub:'need outreach',sc:C.crimson},
    ])+`<div class="grid grid-cols-1 lg:grid-cols-3 gap-5">
      <div class="lg:col-span-2 panel-card bento"><div class="flex items-center justify-between mb-4"><h3 class="font-extrabold text-lg tracking-tight">What needs you today</h3><span class="tag" style="color:${C.crimson};background:#fdf2f4">7 items</span></div>
      <div class="space-y-2.5">
        ${[['fa-triangle-exclamation',C.crimson,'5 students inactive 14+ days','Cloud & IT cohort · likely to drop','Assign outreach',true],
           ['fa-award',C.gold,'12 certifications awaiting approval','Verify proof to count toward outcomes','Review',false],
           ['fa-user-plus',C.info,'8 new applicants need eligibility review','WIOA screening pending','Open queue',false],
           ['fa-briefcase',C.green,'3 placements to confirm','Employers reported hires','Confirm',false]
          ].map(r=>`<div class="flex items-center gap-3 p-3 rounded-2xl ${r[5]?'bg-[#fdf2f4] border border-[#f3d4dc]':'bg-[#fafafa] border border-[#e8e8e8]'} hover:brightness-[.99] cursor-pointer"><div class="w-8 h-8 rounded-lg flex items-center justify-center text-xs text-white" style="background:${r[1]}"><i class="fa-solid ${r[0]}"></i></div><div class="flex-1"><div class="font-bold text-sm">${r[2]}</div><div class="text-[11px] text-[#737373]">${r[3]}</div></div><button class="px-3 py-1.5 ${r[5]?'bg-[#ad2c4d] text-white':'border border-[#e8e8e8]'} text-[11px] font-semibold rounded-full">${r[4]}</button></div>`).join('')}
      </div></div>
      ${bars('Program Health','',[{l:'Cloud & IT',v:'312 · 74%',p:74,c:C.green},{l:'Data & AI',v:'198 · 68%',p:68,c:C.green},{l:'Healthcare',v:'156 · 81%',p:81,c:C.green},{l:'Skilled Trades',v:'81 · 52%',p:52,c:C.crimson},{l:'Manufacturing',v:'100 · 70%',p:70,c:C.green}])}
    </div>`,

  overview:()=>kpiRow([{l:'Students',v:'847',c:C.info},{l:'Placements',v:'213',c:C.green},{l:'Avg Wage',v:'$58k'},{l:'Credentials',v:'541',c:C.gold}])+
    `<div class="grid grid-cols-1 lg:grid-cols-2 gap-5">${bars('Enrollment by program','847 total',[{l:'Cloud & IT',v:'312',p:100,c:C.info},{l:'Data & AI',v:'198',p:63,c:C.info},{l:'Healthcare',v:'156',p:50,c:C.info},{l:'Manufacturing',v:'100',p:32,c:C.info},{l:'Skilled Trades',v:'81',p:26,c:C.info}])}${bars('Outcomes funnel','this cohort',[{l:'Enrolled',v:'847',p:100},{l:'Completed training',v:'601',p:71},{l:'Job-ready',v:'288',p:34},{l:'Placed',v:'213',p:25,c:C.green}])}</div>`,

  /* ---------- STUDENTS ---------- */
  members:()=>`<div class="flex flex-wrap items-center gap-2 mb-4">
      <button class="px-3.5 py-2 rounded-full text-xs font-bold bg-[#ad2c4d] text-white focus-ring">All <span class="opacity-80 tabnum">847</span></button>
      ${['Job-Ready · 64','Interview-Ready · 88','In Training · 612'].map(f=>`<button class="px-3.5 py-2 rounded-full text-xs font-bold bg-white border border-[#e8e8e8] hover:border-[#ad2c4d] transition-colors focus-ring">${f}</button>`).join('')}
      <button class="px-3.5 py-2 rounded-full text-xs font-bold bg-white border border-[#f3d4dc] text-[#ad2c4d] hover:bg-[#fdf2f4] focus-ring">At Risk · 19</button>
      <div class="ml-auto flex gap-2">${btn('<i class="fa-solid fa-filter mr-1"></i>Filter','ghost')}${btn('<i class="fa-solid fa-download mr-1"></i>Export','ghost')}</div></div>`+
    table(['Student','Program','Progress','Readiness','Counselor','Status','Last active'],[
      ['<b>Mike Brown</b><br><span class="text-[10px] text-[#737373]">Austin, TX</span>','Cloud & IT','78%','<b style="color:#4a9b4f">84</b>','S. Chen',statusTag({k:'warn',t:'Job-Ready'}),'2h ago'],
      ['<b>Jasmine Davis</b><br><span class="text-[10px] text-[#737373]">Austin, TX</span>','Healthcare','92%','<b style="color:#4a9b4f">91</b>','R. Patel',statusTag({k:'ok',t:'Placed'}),'1d ago'],
      ['<b>Carlos Torres</b><br><span class="text-[10px] text-[#737373]">Round Rock</span>','Skilled Trades','34%','<b style="color:#ad2c4d">41</b>','S. Chen',statusTag({k:'alert',t:'At Risk'}),'<b style="color:#ad2c4d">16d ago</b>'],
      ['<b>Aisha Williams</b><br><span class="text-[10px] text-[#737373]">Austin, TX</span>','Data & AI','88%','<b style="color:#4a9b4f">79</b>','R. Patel',statusTag({k:'info',t:'Interviewing'}),'5h ago'],
    ])+`<p class="text-center text-xs text-[#737373] mt-3">Showing 4 of 847 · click a row for the Student 360° view</p>`,

  messages:()=>header('Messages','Member ↔ staff threads')+table(['From','Subject','Channel','Status','Updated'],[
      ['<b>Mike Brown</b>','Question about exam voucher','In-app',statusTag({k:'alert',t:'Unread'}),'12m ago'],
      ['<b>Tanya Reed</b>','Schedule change request','Email',statusTag({k:'muted',t:'Replied'}),'2h ago'],
      ['<b>Carlos Torres</b>','Re: outreach check-in','SMS',statusTag({k:'alert',t:'Unread'}),'1d ago'],
    ]),

  /* ---------- PROGRAMS ---------- */
  programs:()=>header('Programs','11 active · 847 enrolled',btn('<i class="fa-solid fa-plus mr-1"></i>New Program','primary'))+cards([
      {icon:'fa-cloud',bg:'#eef5fb',ic:C.info,t:'Cloud & IT',d:'AWS, CompTIA, Salesforce',tag:{k:'ok',t:'Healthy'},foot:'<span class="text-[#737373]">312 enrolled</span><span class="font-bold" style="color:#4a9b4f">74%</span>'},
      {icon:'fa-heart-pulse',t:'Healthcare',d:'CNA, Medical Assistant',tag:{k:'ok',t:'Healthy'},foot:'<span class="text-[#737373]">156 enrolled</span><span class="font-bold" style="color:#4a9b4f">81%</span>'},
      {icon:'fa-helmet-safety',bg:'#FEF3C7',ic:C.gold,t:'Skilled Trades',d:'HVAC, Electrical, Welding',tag:{k:'alert',t:'Attention'},foot:'<span class="text-[#737373]">81 enrolled</span><span class="font-bold" style="color:#ad2c4d">52%</span>'},
      {icon:'fa-robot',bg:'#f3eefb',ic:'#7c3aed',t:'Data & AI',d:'Analytics, ML, Prompting',tag:{k:'ok',t:'Healthy'},foot:'<span class="text-[#737373]">198 enrolled</span><span class="font-bold" style="color:#4a9b4f">68%</span>'},
      {icon:'fa-industry',bg:'#eef5fb',ic:C.info,t:'Manufacturing',d:'CNC, Quality, Logistics',tag:{k:'ok',t:'Healthy'},foot:'<span class="text-[#737373]">100 enrolled</span><span class="font-bold" style="color:#4a9b4f">70%</span>'},
    ]),

  'program-requests':()=>header('Program change requests','3 pending approval')+table(['Student','Current','Requested','Reason','Status'],[
      ['<b>Devon Hill</b>','Manufacturing','Cloud & IT','Found cloud more relevant',statusTag({k:'warn',t:'Pending'})],
      ['<b>Lena Ortiz</b>','Data & AI','Healthcare','Family in nursing',statusTag({k:'warn',t:'Pending'})],

/* ============================================================
   NAV ACTIVATION
   ============================================================ */
const stage=document.getElementById('stage');
function toggleNav(open){
  const sb=document.getElementById('sidebar'),ov=document.getElementById('overlay');
  if(open){sb.classList.remove('-translate-x-full');ov.classList.remove('hidden');}
  else{sb.classList.add('-translate-x-full');ov.classList.add('hidden');}
}
function activate(id){
  const meta=idMeta[id]||{t:'Admin',href:'/admin'};
  document.getElementById('ptitle').textContent=meta.t;
  document.getElementById('pcrumb').textContent=meta.href;
  const fn=PAGES[id];
  stage.innerHTML=`<div class="fade">${fn?fn():note('Screen scaffolded — wires to <code>'+meta.href+'</code> when built.')}</div>`;
  document.querySelectorAll('#nav .nav-a').forEach(b=>{
    const on=b.dataset.id===id;
    b.classList.toggle('bg-[#ad2c4d]',on);
    b.classList.toggle('text-white',on);
    b.classList.toggle('text-[#cfcfcf]',!on);
  });
  // member rows in Students open 360 — keep simple: clicking row does nothing destructive
  stage.scrollTo?.({top:0});
  window.scrollTo({top:0,behavior:'smooth'});
}
activate('today');
