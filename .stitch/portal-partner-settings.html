<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}*{box-sizing:border-box;}body{font-family:Inter,sans-serif;background:#fcf9f8;color:#1c1b1b;margin:0;}</style><title>Partner Settings — WorkforceAP</title></head><body>
<div style="max-width:700px;margin:0 auto;padding:2rem 2rem 4rem;">
  <header style="margin-bottom:2rem;"><h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">Organization Settings</h1><p style="color:#584144;font-size:0.9rem;">Manage your partnership profile and preferences.</p></header>
  <div style="background:#fff;border-radius:0.75rem;padding:1.5rem;border:1px solid #ebe7e7;margin-bottom:1.5rem;">
    <h2 style="font-weight:700;font-size:1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:0.5rem;"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#8c0f37;">business</span>Organization Info</h2>
    <div style="display:flex;flex-direction:column;gap:1rem;">
      <div><label style="display:block;font-size:0.75rem;font-weight:600;color:#584144;margin-bottom:0.375rem;">Organization Name</label><input type="text" value="Techvera" style="width:100%;padding:0.625rem 0.875rem;border:1px solid #debfc2;border-radius:0.375rem;font-size:0.875rem;background:#fcf9f8;outline:none;font-family:Inter,sans-serif;"/></div>
      <div><label style="display:block;font-size:0.75rem;font-weight:600;color:#584144;margin-bottom:0.375rem;">Primary Contact</label><input type="text" value="Michael Brown" style="width:100%;padding:0.625rem 0.875rem;border:1px solid #debfc2;border-radius:0.375rem;font-size:0.875rem;background:#fcf9f8;outline:none;font-family:Inter,sans-serif;"/></div>
      <div><label style="display:block;font-size:0.75rem;font-weight:600;color:#584144;margin-bottom:0.375rem;">Contact Email</label><input type="email" value="michael.brown@techvera.com" style="width:100%;padding:0.625rem 0.875rem;border:1px solid #debfc2;border-radius:0.375rem;font-size:0.875rem;background:#fcf9f8;outline:none;font-family:Inter,sans-serif;"/></div>
    </div>
    <button style="margin-top:1.25rem;padding:0.625rem 1.5rem;background:#8c0f37;color:#fff;border:none;border-radius:0.5rem;font-size:0.875rem;font-weight:600;cursor:pointer;">Save Changes</button>
  </div>
  <div style="background:#fff;border-radius:0.75rem;padding:1.5rem;border:1px solid #ebe7e7;">
    <h2 style="font-weight:700;font-size:1rem;margin-bottom:1.25rem;display:flex;align-items:center;gap:0.5rem;"><span class="material-symbols-outlined" style="font-size:1.1rem;color:#7b5800;">notifications</span>Report Notifications</h2>
    <div style="display:flex;flex-direction:column;gap:0.75rem;">
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:#f6f3f2;border-radius:0.5rem;"><p style="font-weight:600;font-size:0.875rem;margin:0;">Monthly outcome digest</p><div style="width:44px;height:24px;background:#8c0f37;border-radius:9999px;position:relative;"><div style="position:absolute;right:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:9999px;"></div></div></div>
      <div style="display:flex;justify-content:space-between;align-items:center;padding:0.75rem;background:#f6f3f2;border-radius:0.5rem;"><p style="font-weight:600;font-size:0.875rem;margin:0;">New milestone submissions</p><div style="width:44px;height:24px;background:#8c0f37;border-radius:9999px;position:relative;"><div style="position:absolute;right:3px;top:3px;width:18px;height:18px;background:#fff;border-radius:9999px;"></div></div></div>
    </div>
  </div>
</div></body></html>
