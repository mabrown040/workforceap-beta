<h3 class="font-headline font-bold text-xl leading-snug relative z-10 text-on-surface">What type of work do you find most satisfying?</h3>
</div>
<!-- Options List -->
<div class="space-y-3">
<!-- Option 1: Selected State -->
<button class="w-full flex items-center gap-4 p-5 bg-rose-50/50 border-2 border-primary-container rounded-xl text-left transition-all active:scale-95">

<span class="text-xs text-on-surface-variant/70 uppercase font-bold tracking-wider">Technology</span>
</div>
</button>
<!-- Option 2 -->
<button class="w-full flex items-center gap-4 p-5 bg-surface-container-low rounded-xl text-left hover:bg-surface-container-high transition-colors active:scale-95">

<span class="material-symbols-outlined text-2xl" data-icon="biotech">biotech</span>
</div>
<div>
<span class="block font-semibold text-on-surface">Healthcare &amp; Science</span>
<span class="text-xs text-on-surface-variant/70 uppercase font-bold tracking-wider">Life Sciences</span>
</div>
</button>
<!-- Option 3 -->
<button class="w-full flex items-center gap-4 p-5 bg-surface-container-low rounded-xl text-left hover:bg-surface-container-high transition-colors active:scale-95">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-2xl" data-icon="precision_manufacturing">precision_manufacturing</span>
</div>
<div>
<span class="block font-semibold text-on-surface">Advanced Manufacturing</span>
<span class="text-xs text-on-surface-variant/70 uppercase font-bold tracking-wider">Industrial</span>

<!-- Option 4 -->
<button class="w-full flex items-center gap-4 p-5 bg-surface-container-low rounded-xl text-left hover:bg-surface-container-high transition-colors active:scale-95">
<div class="w-12 h-12 rounded-lg bg-surface-container-highest flex items-center justify-center text-on-surface-variant">
<span class="material-symbols-outlined text-2xl" data-icon="handshake">handshake</span>
</div>
<div>

<span class="text-xs text-on-surface-variant/70 uppercase font-bold tracking-wider">Corporate</span>
