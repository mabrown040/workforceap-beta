<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<style>.material-symbols-outlined{font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}*{box-sizing:border-box;}body{font-family:Inter,sans-serif;background:#fcf9f8;color:#1c1b1b;margin:0;}</style><title>Partner Outcomes — WorkforceAP</title></head><body>
<div style="max-width:900px;margin:0 auto;padding:2rem 2rem 4rem;">
  <div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:2rem;">
    <div><h1 style="font-size:1.75rem;font-weight:800;letter-spacing:-0.02em;margin-bottom:0.375rem;">Outcome Reports</h1><p style="color:#584144;font-size:0.9rem;">Impact and placement data for your organization.</p></div>
    <button style="padding:0.625rem 1.25rem;background:#f0edec;border:none;border-radius:0.5rem;font-size:0.875rem;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:0.375rem;"><span class="material-symbols-outlined" style="font-size:1rem;">download</span>Download Q1 Report</button>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-bottom:2rem;">
    <div style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-align:center;border-left:4px solid #8c0f37;"><p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#584144;margin-bottom:0.375rem;">Total Placed</p><p style="font-size:2rem;font-weight:900;color:#8c0f37;line-height:1;">12</p></div>
    <div style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-align:center;"><p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#584144;margin-bottom:0.375rem;">Avg Time</p><p style="font-size:2rem;font-weight:900;color:#1c1b1b;line-height:1;">4.2mo</p></div>
    <div style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-align:center;"><p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#584144;margin-bottom:0.375rem;">Avg Salary</p><p style="font-size:2rem;font-weight:900;color:#7b5800;line-height:1;">$62K</p></div>
    <div style="background:#fff;border-radius:0.75rem;padding:1.25rem;border:1px solid #ebe7e7;text-align:center;"><p style="font-size:0.7rem;font-weight:700;text-transform:uppercase;color:#584144;margin-bottom:0.375rem;">Active Now</p><p style="font-size:2rem;font-weight:900;color:#166534;line-height:1;">47</p></div>
  </div>
  <div style="background:#fff;border-radius:0.75rem;padding:1.5rem;border:1px solid #ebe7e7;margin-bottom:1.5rem;">
    <h3 style="font-weight:700;font-size:1rem;margin-bottom:1.25rem;">Placements by Quarter</h3>
    <div style="display:flex;align-items:flex-end;gap:1.5rem;height:120px;padding:0 0.5rem;">
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;flex:1;"><div style="width:100%;border-radius:0.25rem;background:#debfc2;" style="height:30px;"></div><span style="font-size:0.75rem;color:#584144;">Q1 25</span><span style="font-size:0.7rem;font-weight:600;color:#8b7073;">2</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;flex:1;"><div style="width:100%;height:60px;border-radius:0.25rem;background:#ad2c4d;"></div><span style="font-size:0.75rem;color:#584144;">Q2 25</span><span style="font-size:0.7rem;font-weight:600;color:#584144;">4</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;flex:1;"><div style="width:100%;height:45px;border-radius:0.25rem;background:#ad2c4d;"></div><span style="font-size:0.75rem;color:#584144;">Q3 25</span><span style="font-size:0.7rem;font-weight:600;color:#584144;">3</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;flex:1;"><div style="width:100%;height:90px;border-radius:0.25rem;background:#8c0f37;"></div><span style="font-size:0.75rem;color:#584144;">Q4 25</span><span style="font-size:0.7rem;font-weight:600;color:#8c0f37;">6</span></div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:0.375rem;flex:1;"><div style="width:100%;height:30px;border-radius:0.25rem 0.25rem 0 0;background:#8c0f37;opacity:0.4;border:2px dashed #8c0f37;box-sizing:border-box;"></div><span style="font-size:0.75rem;color:#584144;">Q1 26</span><span style="font-size:0.7rem;font-weight:600;color:#8b7073;">2 YTD</span></div>
    </div>
  </div>
</div></body></html>
