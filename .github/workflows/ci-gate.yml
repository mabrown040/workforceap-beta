name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # Stub values so Next.js/Prisma don't crash at build time in CI.
      # Real secrets are never needed for a typecheck+build gate.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-secret-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      # GitHub runners have 16GB; the cold production build (no cache) was
      # riding the 4GB ceiling and OOM'd (exit 134) as the app grew. 8GB gives
      # headroom without approaching the runner limit.
      NODE_OPTIONS: "--max-old-space-size=8192"
      RATE_LIMIT_ALLOW_MISSING_UPSTASH: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: node scripts/prisma-env.js prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      # Icon font coverage — fails if source uses a Material Symbols icon
      # missing from the committed subset (would render as raw ligature
      # text like FLIGHT_TAKEOFF in production). The `npm run build`
      # script runs this on Vercel, but the Build step below invokes
      # `npx next build` directly, so gate it explicitly here.
      - name: Verify Material Symbols subset
        run: node scripts/verify-material-symbols-font-size.mjs

      # Unit tests (Node's built-in test runner via the `test:unit`
      # script, which uses tsx). 499 specs run deterministically without
      # external services; the small set that needs vitest, server-only,
      # a live postgres, or a stale-assertion review is filtered in
      # `scripts/test-unit.mjs` with the reason logged at startup.
      # Required gate — failures block the PR.
      - name: Unit tests
        run: npm run test:unit

      # Lint — report-only for now. AGENTS.md and AUDIT-2026-05-16 §H-CI4
      # note 5 known errors in the codebase (bare <table> in 3 admin
      # components, 1 missing alt). Surfaces lint output on every PR so
      # new errors are visible. Flip to required (drop continue-on-error)
      # after the known errors are fixed.
      - name: Lint (report-only)
        run: npm run lint
        continue-on-error: true
        timeout-minutes: 5

      # Vitest — re-enabled 2026-07-02 as report-only. The suite is fully
      # green (1179 tests / 108 files) after the mock/assertion repair and
      # the vitest.config.ts exclude fix (Playwright e2e + node:test files
      # are no longer collected, which is also what was hanging the earlier
      # runs at 0%). Flip to required (drop continue-on-error) after a few
      # stable runs.
      - name: Vitest (report-only)
        run: timeout 480 npm run test:vitest || true
        continue-on-error: true
        timeout-minutes: 10

      # Dead-code detection — report-only. No knip/ts-prune/depcheck config
      # existed before this; `knip` was added as a devDependency (see
      # package.json) but hasn't been tuned yet (no knip.json, so it uses
      # default Next.js/Prisma-aware detection which may have false
      # positives on this codebase, e.g. dynamic route handlers or
      # barrel re-exports). Surfaces unused files/exports/deps on every
      # PR without blocking. Flip to required once the initial report has
      # been triaged and a knip.json config silences accepted false
      # positives.
      - name: Dead code (report-only)
        run: npm run deadcode
        continue-on-error: true
        timeout-minutes: 5

      # Tenant-isolation guardrails. Static-grep check across high-risk
      # routes — expanded in PR 2 of AUDIT-2026-05-16 to cover the
      # cross-tenant cluster (§C-T1..§H-T4). Required gate.
      - name: Verify high-risk tenant routes
        run: node scripts/verify-high-risk-tenant-routes.cjs

      - name: Build
        run: npm run build
        env:
          SKIP_ENV_VALIDATION: "1"
          RATE_LIMIT_ALLOW_MISSING_UPSTASH: "1"
        timeout-minutes: 15
