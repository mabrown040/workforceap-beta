<body class="text-on-surface selection:bg-primary-container selection:text-white">
<!-- Top Navigation Shell -->
<header class="fixed top-0 w-full z-50 bg-[#fcf9f8] dark:bg-slate-950/80 backdrop-blur-xl flex justify-between items-center px-6 py-4 w-full">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-[#AD2C4D]" data-icon="school">school</span>
<span class="text-xl font-black text-[#AD2C4D] tracking-tighter">WorkforceAP</span>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#584144]" data-icon="account_circle">account_circle</span>
</div>
</header>
<main class="pt-24 pb-32 px-6 max-w-[390px] mx-auto min-h-screen bg-surface">
<!-- Hero Section -->
<section class="mb-10">
<h1 class="text-4xl font-extrabold tracking-tight text-on-surface mb-2">Get in Touch</h1>
<p class="text-on-surface-variant text-md leading-relaxed">We respond within 24-48 hours</p>
</section>
<!-- Asymmetric Contact Methods Grid -->
<section class="grid grid-cols-2 gap-4 mb-8">
<div class="bg-surface-container-lowest p-5 rounded-xl transition-all hover:bg-surface-container-low">
<div class="w-10 h-10 rounded-lg bg-primary/5 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-primary" data-icon="alternate_email">alternate_email</span>
</div>
<p class="text-[11px] font-bold uppercase tracking-wider text-primary mb-1">Email</p>
<p class="text-sm font-semibold break-words">info@workforceap.org</p>
</div>
<div class="bg-surface-container-lowest p-5 rounded-xl transition-all hover:bg-surface-container-low">
<div class="w-10 h-10 rounded-lg bg-secondary-container/10 flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-secondary" data-icon="phone">phone</span>
</div>
<p class="text-[11px] font-bold uppercase tracking-wider text-secondary mb-1">Phone</p>
<p class="text-sm font-semibold">(512) 777-1808</p>
</div>
</section>
<!-- Form Section with Intentional Asymmetry -->
<section class="bg-surface-container-low p-6 rounded-xl relative overflow-hidden">
<div class="absolute top-0 right-0 w-32 h-32 bg-primary/5 rounded-full -mr-16 -mt-16 blur-3xl"></div>
<form class="space-y-6 relative z-10">
<div>
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1">Full Name</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary/20 placeholder:text-on-surface-variant/40" placeholder="Jane Doe" type="text"/>
</div>
<div>
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1">Email Address</label>
<input class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary/20 placeholder:text-on-surface-variant/40" placeholder="jane@example.com" type="email"/>
</div>
<div>
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1">Subject</label>
<select class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary/20 appearance-none">
<option>General Inquiry</option>
<option>Enrollment Support</option>
<option>Employer Partnership</option>
<option>Other</option>
</select>
</div>
<div>
<label class="block text-[11px] font-bold uppercase tracking-widest text-on-surface-variant mb-2 ml-1">Message</label>
<textarea class="w-full bg-surface-container-lowest border-none rounded-lg px-4 py-3 text-on-surface focus:ring-2 focus:ring-primary/20 placeholder:text-on-surface-variant/40 resize-none" placeholder="How can we help you?" rows="4"></textarea>
</div>
<button class="w-full bg-gradient-to-r from-primary to-primary-container text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/10 active:scale-95 transition-all" type="submit">
                    Send Message
                </button>
</form>
</section>
<!-- Footer / Office Info -->
<footer class="mt-12 mb-8 text-center">
<div class="inline-block px-4 py-2 bg-surface-container-high rounded-full">
<p class="text-[11px] font-medium tracking-wide text-on-surface-variant">
                    Austin, TX <span class="mx-2 text-outline-variant">|</span> info@workforceap.org
                </p>
</div>
<div class="mt-6 flex justify-center opacity-20">
<img alt="WorkforceAP watermark" class="grayscale contrast-125" data-alt="minimalist grayscale logo of WorkforceAP with clean professional typography and academic emblem on white background" src="https://lh3.googleusercontent.com/aida-public/AB6AXuD3mWDeKDf9HawtISFYJjTYe4cqPSigTczblXxQD46wSEUq2CkvoKiXQsF5WEQ7VezP4LR33xdyZ1EVKFsgprY01FWfViHg6eVNRItgEX3bYZfwvoQgqfdkjsC7xdqGzGoClLCod5U0Gay9jHsCwO0PvkEUJ4kJ2H0UpOX6mU815WVl_8l1usL2VAoVmY3SChR59VMrBise9tSzdHrwdKQY486GQ6W2jod6hMsCSu0ouK-knint6L_V6q-FDQ-GcfqGWTbBYy74R6DP"/>
</div>
</footer>
</main>
<!-- Bottom Navigation Shell -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-4 pb-6 pt-2 bg-[#fcf9f8]/80 backdrop-blur-xl shadow-[0_-4px_24px_rgba(28,27,27,0.04)] rounded-t-xl">
<a class="flex flex-col items-center justify-center text-[#584144] px-4 py-1 hover:text-[#AD2C4D] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home">home</span>
<span class="text-[11px] font-medium uppercase tracking-wider font-Inter">Home</span>
</a>
<a class="flex flex-col items-center justify-center text-[#584144] px-4 py-1 hover:text-[#AD2C4D] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="import_contacts">import_contacts</span>
<span class="text-[11px] font-medium uppercase tracking-wider font-Inter">Courses</span>
</a>
<a class="flex flex-col items-center justify-center text-[#584144] px-4 py-1 hover:text-[#AD2C4D] transition-all" href="#">
<span class="material-symbols-outlined mb-1" data-icon="Description">description</span>
<span class="text-[11px] font-medium uppercase tracking-wider font-Inter">Resources</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#AD2C4D]/10 text-[#AD2C4D] rounded-xl px-4 py-1" href="#">
<span class="material-symbols-outlined mb-1" data-icon="contact_support" style="font-variation-settings: 'FILL' 1;">contact_support</span>
<span class="text-[11px] font-medium uppercase tracking-wider font-Inter">Contact</span>
</a>
</nav>
