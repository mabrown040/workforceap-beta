name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Typecheck & Build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Stub values so Next.js/Prisma don't crash at build time in CI.
      # Real secrets are never needed for a typecheck+build gate.
      DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
      NEXTAUTH_SECRET: "ci-secret-placeholder"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXT_PUBLIC_SUPABASE_URL: "https://placeholder.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "placeholder"
      NODE_OPTIONS: "--max-old-space-size=4096"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: node scripts/prisma-env.js prisma generate

      - name: Typecheck
        # Filter out pre-existing errors in test files (roles.test.ts uses tsx imports
        # incompatible with tsc outside the test runner). All non-test errors are fatal.
        run: |
          set +e
          npx tsc --noEmit 2>&1 | tee /tmp/tsc-output.txt
          TSC_EXIT=${PIPESTATUS[0]}
          set -e
          # Fail only if there are errors outside of test/spec files
          NON_TEST_ERRORS=$(grep 'error TS' /tmp/tsc-output.txt | grep -v '\.test\.ts\|\.spec\.ts' || true)
          if [ -n "$NON_TEST_ERRORS" ]; then
            echo "❌ TypeScript errors in non-test files:"
            echo "$NON_TEST_ERRORS"
            exit 1
          fi
          echo "✅ Typecheck passed (test file errors ignored)"

      # Unit tests (Node's built-in test runner via the `test:unit`
      # script, which uses tsx). 499 specs run deterministically without
      # external services; the small set that needs vitest, server-only,
      # a live postgres, or a stale-assertion review is filtered in
      # `scripts/test-unit.mjs` with the reason logged at startup.
      # Required gate — failures block the PR.
      - name: Unit tests
        run: npm run test:unit

      - name: Build
        run: npx next build
        env:
          SKIP_ENV_VALIDATION: "1"
